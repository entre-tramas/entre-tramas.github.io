faq:
  eyebrow: Preguntas
  h2: Antes de sumarte.
  aside: La que falte, se responde por Instagram; por ahí llega también la muestra gratuita.
  items:
    - q: ¿El club es para quien ya lee o para empezar?
      a: 'Para quien ya lee y quiere profundizar: no está pensado como iniciación a la lectura. Con leer el cuento de la semana y llevar las impresiones al encuentro alcanza.'
    - q: ¿Qué hay que hacer antes de cada encuentro?
      a: Leer el cuento y los materiales por cuenta propia. En el encuentro, cada uno comparte lo que comprendió; no se lee en voz alta ni hay entregas.
    - q: ¿Qué incluye la muestra gratuita?
      a: Un cuento completo con su material de análisis y su infografía, más un video breve de presentación del club. Todo sin costo, sin otro paso que un mensaje directo.
    - q: ¿Cómo se paga el club?
      a: 'A mano: se consulta por Instagram, se confirman las condiciones y se coordina la cuota. No hay pasarela de pago en esta página.'
    - q: ¿Y la modalidad presencial en La Plata?
      a: 'Se está armando un grupo reducido con personas conocidas o recomendadas, con té y algo rico. Formato, frecuencia y precio siguen en definición: quien le interese puede dejar su nombre por Instagram.'
    - q: ¿Cuándo arranca?
      a: 'La fecha todavía no está cerrada. La manera más simple de enterarse primero es seguir el club en Instagram: la muestra gratuita llega antes que el primer mes.'
