como_funciona:
  eyebrow: Cómo funciona
  h2: Tres ritmos que se suman.
  aside: El material se lee por cuenta propia y el encuentro es la única cita fija del calendario.
  features:
    - num: I.
      meta: Cada semana
      title: Llega un cuento nuevo.
      body: 'Por mensaje digital: el relato completo de un autor clásico o contemporáneo, con un material de análisis para leerlo con contexto y una infografía con lo esencial.'
    - num: II.
      meta: A tu ritmo
      title: Se lee por cuenta propia.
      body: 'Un cuento breve y materiales de una sola lectura, cuando te encuentre bien. Sin necesidad de leer en voz alta ni de estudiar como en un curso: con las impresiones listas alcanza.'
    - num: III.
      meta: Cada 15 días
      title: Luego, el encuentro.
      body: 'Por videollamada: cada participante comparte lo que comprendió. Las interpretaciones se cruzan, y del mismo cuento salen miradas distintas y alguna pregunta que va más allá de la página.'
sobre_mi:
  eyebrow: Sobre mí
  h2: Quién coordina el club.
  paragraphs:
    - 'Mi formación en psicología y mi manera de leer con lápiz en mano se cruzan en todas las partes del club: en la selección de los cuentos, en los materiales que apuntan a aportar contexto y en la coordinación de los encuentros.'
    - 'Trabajo para que la conversación abra preguntas sin imponer conclusiones. La idea es que cada persona se lleve algo propio: una manera nueva de mirar una historia, o un pedazo de su vida a la luz de la lectura.'
  sign: — Entre-Tramas, La Plata.
principios:
  eyebrow: Por diseño
  h2: Pensado para leer más hondo.
  aside: Cuatro decisiones que sostienen el modo en que el club se lee y se conversa.
  principles:
    - title: Sin cursada.
      body: 'Leés a tu ritmo y por cuenta propia: un cuento breve por semana es el único compromiso del calendario.'
    - title: Sin lectura correcta.
      body: 'Cada encuentro suma miradas al mismo cuento y la conversación queda abierta: nadie la cierra con la respuesta final.'
    - title: Sin terapia.
      body: La coordinación combina literatura y psicología para abrir preguntas. No promete resultados terapéuticos ni exige que nadie comparta lo personal.
    - title: Con identidad propia.
      body: 'La selección busca profundidad sin perder el disfrute: clásicos que dejan pensando y relatos distendidos para tomar con un mate.'
modalidades:
  eyebrow: Modalidades
  h2: La misma lectura, dos escenarios.
  aside: 'La modalidad virtual es la principal: los materiales viajan digital y los encuentros reúnen a lectores de cualquier provincia.'
  copy:
    - 'El club arranca en formato virtual y abierto: cualquier parte del país, materiales digitales, encuentros por videollamada.'
    - A la vez, se explora un grupo presencial reducido en La Plata, pensado para personas conocidas o recomendadas, con té y algo rico en la mesa. El formato, la frecuencia y el precio están todavía en definición.
  aside2: Si la presencial te tienta, dejá tu nombre por Instagram y avisamos cuando el grupo quede armado.
  virtual:
    title: El club virtual
    sub: La modalidad principal
    items:
      - Los cuatro cuentos del mes llegan por digital, con sus materiales.
      - Los encuentros quincenales se hacen por videollamada.
      - Se participa desde cualquier provincia.
    note: La conversación es en vivo y en grupo; el resto del mes, cada uno lee por su cuenta.
  presencial:
    title: El club presencial
    sub: La Plata · En definición
    items:
      - Grupo reducido, con personas conocidas o recomendadas.
      - Encuentros frente a frente, con té y algo rico.
      - 'Formato, frecuencia y precio: se confirman de a poco.'
    note: Si te interesa, dejá tu nombre por Instagram y avisamos cuando el grupo quede armado.
  panel_cta: Consultá por Instagram
incluye:
  eyebrow: Qué incluye y cuánto cuesta
  h2: Lo que llega cada mes.
  aside: 'Todo viaja digital: los encuentros se hacen por videollamada y la inscripción se coordina por Instagram.'
  rows:
    - num: '4'
      title: Cuentos por mes
      body: 'Uno por cada semana: relatos de ficción de distintas épocas y autores, siempre en formato breve.'
    - num: '4'
      title: Materiales de análisis
      body: Cada cuento llega acompañado de un texto que aporta contexto, abre perspectivas y deja una o dos preguntas pendientes.
    - num: '4'
      title: Infografías
      body: Lo esencial de cada lectura condensado en una imagen, para revisar rápido antes de cada encuentro.
    - num: '2'
      title: Encuentros quincenales
      body: 'Por videollamada: se comparte lo que cada uno comprendió y se profundiza en la lectura con las miradas del grupo.'
